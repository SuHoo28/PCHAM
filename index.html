<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 스피드 퀴즈 챌린지</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // FIXME: 본인의 Firebase 프로젝트 설정값으로 변경하세요!
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.fbAuth = auth;
    window.fbDb = db;
    window.signIn = signInWithEmailAndPassword;
    window.signUp = createUserWithEmailAndPassword;
    window.logOut = signOut;
    window.dbDoc = doc;
    window.dbSet = setDoc;
    window.dbCollection = collection;
    window.dbQuery = query;
    window.dbOrderBy = orderBy;
    window.dbLimit = limit;
    window.dbOnSnapshot = onSnapshot;
  </script>

  <style>
    * { box-sizing: border-box; font-family: 'Malgun Gothic', sans-serif; }
    body { background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
    .hidden { display: none !important; }
    h2 { margin-top: 0; color: #333; }
    input[type="email"], input[type="password"] { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #4A90E2; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    button:hover { background: #357ABD; }
    .secondary-btn { background: #6c757d; }
    .secondary-btn:hover { background: #5a6268; }
    
    /* 과목 선택 버튼 */
    .subject-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 20px 0; }
    .subject-btn { padding: 15px; background: #e9ecef; color: #495057; border: 2px solid transparent; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .subject-btn.active { background: #e8f4fd; color: #1a73e8; border-color: #1a73e8; }
    
    /* 타이머 및 로딩바 공통 공정 */
    .bar-container { width: 100%; background: #eee; height: 12px; border-radius: 6px; margin: 20px 0; overflow: hidden; position: relative; }
    .bar-fill { background: #dc3545; width: 100%; height: 100%; transition: width 0.1s linear; }
    #loadingBarFill { background: #28a745; width: 0%; transition: width 0.2s ease-out; }
    
    .quiz-text { font-size: 20px; font-weight: bold; margin-bottom: 20px; word-break: keep-all; min-height: 60px; }
    .option-btn { text-align: left; background: #f8f9fa; color: #333; border: 1px solid #ddd; margin-bottom: 8px; }
    .option-btn:hover { background: #e2e6ea; }
    
    .ranking-list { text-align: left; margin: 20px 0; padding: 0; list-style: none; }
    .ranking-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; font-size: 16px; }
  </style>
</head>
<body>

  <div id="view-auth" class="card">
    <h2>로그인 / 회원가입</h2>
    <input type="email" id="auth-email" placeholder="이메일 주소">
    <input type="password" id="auth-pw" placeholder="비밀번호 (6자리 이상)">
    <button onclick="handleLogin()">로그인</button>
    <button onclick="handleSignUp()" class="secondary-btn">신규 회원가입</button>
  </div>

  <div id="view-lobby" class="card hidden">
    <h2>퀴즈 과목 선택</h2>
    <p>문제를 풀 과목을 선택하세요 (최소 1개 이상 다중 선택 가능)</p>
    <div class="subject-grid">
      <button class="subject-btn" onclick="toggleSubject(this, '국어')">국어</button>
      <button class="subject-btn" onclick="toggleSubject(this, '수학')">수학</button>
      <button class="subject-btn" onclick="toggleSubject(this, '과학')">과학</button>
      <button class="subject-btn" onclick="toggleSubject(this, '사회')">사회</button>
      <button class="subject-btn" onclick="toggleSubject(this, '영어')">영어</button>
    </div>
    <button onclick="prepareGame()" style="background: #28a745;">게임 시작 (총 20문항)</button>
    <button onclick="handleLogout()" class="secondary-btn" style="margin-top: 20px;">로그아웃</button>
  </div>

  <div id="view-loading" class="card hidden">
    <h2 id="loading-status">AI 문제 데이터 요청 중...</h2>
    <div class="bar-container">
      <div id="loadingBarFill" class="bar-fill"></div>
    </div>
    <p style="color: #666; font-size: 14px;" id="loading-subtext">잠시만 기다려주세요.</p>
  </div>

  <div id="view-game" class="card hidden">
    <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold;">
      <span id="quiz-progress">1 / 20</span>
      <span id="quiz-score">점수: 0점</span>
    </div>
    <div class="bar-container"><div id="timerBar" class="bar-fill"></div></div>
    <div style="font-size: 14px; color: #888; margin-bottom: 5px;" id="quiz-subject">[과목]</div>
    <div class="quiz-text" id="quiz-question">문제가 여기에 표시됩니다.</div>
    <div id="quiz-options"></div>
    <button onclick="speakText(document.getElementById('quiz-question').innerText)" class="secondary-btn" style="font-size: 14px; padding: 6px; margin-top: 15px;">🔊 문제 다시 듣기</button>
  </div>

  <div id="view-result" class="card hidden">
    <h2>🎉 게임 종료!</h2>
    <h1 id="final-score" style="color: #4A90E2; margin: 10px 0;">0점</h1>
    <p id="game-summary">20문제 중 X문제를 맞추셨습니다!</p>
    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">
    <h3>🏆 실시간 통합 랭킹 TOP 10</h3>
    <ul id="ranking-board" class="ranking-list"></ul>
    <button onclick="goLobby()" style="background: #e67e22;">다시 도전하기</button>
  </div>

  <script>
    /* ==========================================
       샘플 문제 풀 데이터
       ========================================== */
    const quizBank = {
      '국어': [
        { q: "다음 중 표준어가 아닌 것은 무엇일까요?", o: ["설렁탕", "자장면", "구라치다", "끄적이다"], a: 2 },
        { q: "시 '진달래꽃'의 작가는 누구일까요?", o: ["김소월", "윤동주", "이육사", "한용운"], a: 0 },
        { q: "사자성어 '구사일생'의 뜻으로 올바른 것은?", o: ["아홉 번 살고 한 번 죽는다", "죽을 고비를 넘기고 겨우 살아남음", "처음부터 끝까지 한결같음", "말을 조심해야 한다"], a: 1 }
      ],
      '수학': [
        { q: "다항식 x² - 4를 인수분해하면 어떻게 될까요?", o: ["(x-2)(x-2)", "(x+2)(x-2)", "(x+4)(x-1)", "인수분해 불가능"], a: 1 },
        { q: "로그 계산 기호 log₂8 의 값은 얼마일까요?", o: ["2", "3", "4", "8"], a: 1 },
        { q: "두 직선이 서로 평행할 때 두 직선의 기울기는?", o: ["서로 같다", "곱해서 -1이 된다", "서로 다르다", "알 수 없다"], a: 0 }
      ],
      '과학': [
        { q: "물(H₂O) 분자 한 개에 들어있는 수소 원자의 개수는?", o: ["1개", "2개", "3개", "4개"], a: 1 },
        { q: "뉴턴의 운동 제2법칙을 나타내는 공식은?", o: ["F = ma", "E = mc²", "V = IR", "P = mv"], a: 0 },
        { q: "우리 몸에서 인슐린을 분비하여 혈당을 조절하는 기관은?", o: ["간", "위", "이자(췌장)", "소장"], a: 2 }
      ],
      '사회': [
        { q: "대한민국의 헌법 제1조 1항은 무엇일까요?", o: ["대한민국은 민주공화국이다", "대한민국의 주권은 국민에게 있다", "모든 국민은 법 앞에 평등하다", "국가는 국민을 보호한다"], a: 0 },
        { q: "기회비용의 정의로 올바른 것은?", o: ["실제 지출된 비용", "선택으로 인해 포기한 가치 중 가장 큰 것", "공짜로 얻은 이익", "생산에 필요한 최소 비용"], a: 1 },
        { q: "조선 시대 최고의 법전이었던 책의 이름은?", o: ["삼국유사", "경국대전", "조선왕조실록", "목민심서"], a: 1 }
      ],
      '영어': [
        { q: "다음 중 '망설이다, 주저하다'라는 뜻을 가진 영단어는?", o: ["Heresy", "Hesitate", "Hurry", "Harvest"], a: 1 },
        { q: "문장 'I have been to Paris.'의 올바른 해석은?", o: ["나는 파리에 가고 있다", "나는 파리에 가본 적이 있다", "나는 파리에 살았었다", "나는 파리에 가야만 한다"], a: 1 },
        { q: "단어 'Approve'의 반대말은 무엇일까요?", o: ["Disapprove", "Unapprove", "Imapprove", "Inapprove"], a: 0 }
      ]
    };

    let currentUser = null;
    let selectedSubjects = [];
    let gameQuizzes = [];
    let currentQuizIdx = 0;
    let totalScore = 0;
    let correctCount = 0;
    
    let timerInterval = null;
    let quizStartTime = 0;
    const LIMIT_TIME = 60;

    function showView(viewId) {
      ['view-auth', 'view-lobby', 'view-loading', 'view-game', 'view-result'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(viewId).classList.remove('hidden');
    }

    function speakText(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = 1.1; // 읽는 속도를 약간 빠르게 상향
      window.speechSynthesis.speak(utterance);
    }

    /* ==========================================
       [핵심 수정] 로딩 프로세스 및 미리 문제 생성
       ========================================== */
    function prepareGame() {
      if(selectedSubjects.length === 0) {
        return alert('최소 1개 이상의 과목을 선택해주세요!');
      }

      showView('view-loading');
      const statusText = document.getElementById('loading-status');
      const subtext = document.getElementById('loading-subtext');
      const barFill = document.getElementById('loadingBarFill');
      
      barFill.style.width = '0%';
      
      // 1단계 시뮬레이션: 문제 수집 및 제작
      setTimeout(() => {
        statusText.innerText = "⚙️ 과목별 문제 템플릿 제작 중...";
        subtext.innerText = `선택된 과목: ${selectedSubjects.join(', ')}`;
        barFill.style.width = '35%';

        let pool = [];
        selectedSubjects.forEach(sub => {
          const items = quizBank[sub].map(q => ({...q, subject: sub}));
          pool = pool.concat(items);
        });

        // 2단계 시뮬레이션: 20문항 추출 및 랜덤 배치(셔플)
        setTimeout(() => {
          statusText.innerText = "🔀 20문항 추출 및 무작위 랜덤 배치 중...";
          subtext.innerText = "완벽한 스피드 게임을 위해 배치를 완전히 꼬는 중입니다.";
          barFill.style.width = '75%';

          pool.sort(() => Math.random() - 0.5);
          gameQuizzes = [];
          for(let i=0; i<20; i++) {
            gameQuizzes.push(pool[i % pool.length]);
          }
          // 전체 다시 셔플하여 완벽히 순서 섞기 (런타임 도중 계산 차단)
          gameQuizzes.sort(() => Math.random() - 0.5);

          // 3단계 시뮬레이션: 완료 및 게임룸 진입
          setTimeout(() => {
            statusText.innerText = "✅ 준비 완료!";
            subtext.innerText = "게임방으로 진입합니다!";
            barFill.style.width = '100%';

            setTimeout(() => {
              // 초기화 후 진짜 인게임 시작
              currentQuizIdx = 0;
              totalScore = 0;
              correctCount = 0;
              showView('view-game');
              renderQuiz();
            }, 600);

          }, 1000);
        }, 1200);
      }, 800);
    }

    /* ==========================================
       인게임 구동 로직 (이미 다 배치된 상태에서 인덱스만 호출)
       ========================================== */
    function renderQuiz() {
      if(currentQuizIdx >= 20) {
        endGame();
        return;
      }

      const quiz = gameQuizzes[currentQuizIdx];
      
      document.getElementById('quiz-progress').innerText = `${currentQuizIdx + 1} / 20`;
      document.getElementById('quiz-score').innerText = `점수: ${totalScore}점`;
      document.getElementById('quiz-subject').innerText = `[${quiz.subject}]`;
      document.getElementById('quiz-question').innerText = quiz.q;

      const optionsDiv = document.getElementById('quiz-options');
      optionsDiv.innerHTML = '';
      quiz.o.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${idx + 1}. ${opt}`;
        btn.onclick = () => handleAnswer(idx);
        optionsDiv.appendChild(btn);
      });

      // 문제 음성 재생
      speakText(`${quiz.subject} 문제입니다. ${quiz.q}`);
      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      quizStartTime = Date.now();
      const bar = document.getElementById('timerBar');
      
      timerInterval = setInterval(() => {
        const elapsed = (Date.now() - quizStartTime) / 1000;
        const remainPercent = Math.max(0, ((LIMIT_TIME - elapsed) / LIMIT_TIME) * 100);
        bar.style.width = remainPercent + '%';

        if(elapsed >= LIMIT_TIME) {
          clearInterval(timerInterval);
          handleAnswer(-1);
        }
      }, 100);
    }

    function handleAnswer(chosenIdx) {
      clearInterval(timerInterval);
      window.speechSynthesis.cancel();

      const quiz = gameQuizzes[currentQuizIdx];
      const elapsed = (Date.now() - quizStartTime) / 1000;

      if(chosenIdx === quiz.a) {
        const bonus = Math.max(0, Math.round((LIMIT_TIME - elapsed) * 5));
        totalScore += (100 + bonus);
        correctCount++;
      }

      currentQuizIdx++;
      setTimeout(renderQuiz, 400);
    }

    /* ==========================================
       Firebase Auth & Firestore 백엔드 바인딩
       ========================================== */
    setTimeout(() => {
      window.fbAuth.onAuthStateChanged(user => {
        if (user) {
          currentUser = user;
          showView('view-lobby');
          loadRanking();
        } else {
          currentUser = null;
          showView('view-auth');
        }
      });
    }, 1000);

    async function handleLogin() {
      const email = document.getElementById('auth-email').value;
      const pw = document.getElementById('auth-pw').value;
      if(!email || !pw) return alert('이메일과 비밀번호를 채워주세요.');
      try { await window.signIn(window.fbAuth, email, pw); } catch(e) { alert('로그인 실패: ' + e.message); }
    }

    async function handleSignUp() {
      const email = document.getElementById('auth-email').value;
      const pw = document.getElementById('auth-pw').value;
      if(!email || !pw) return alert('이메일과 비밀번호를 채워주세요.');
      try {
        await window.signUp(window.fbAuth, email, pw);
        alert('회원가입 완료!');
      } catch(e) { alert('회원가입 실패: ' + e.message); }
    }

    function handleLogout() { window.logOut(window.fbAuth); }

    function toggleSubject(btn, subjectName) {
      btn.classList.toggle('active');
      if(btn.classList.contains('active')) { selectedSubjects.push(subjectName); } 
      else { selectedSubjects = selectedSubjects.filter(s => s !== subjectName); }
    }

    async function endGame() {
      showView('view-result');
      document.getElementById('final-score').innerText = `${totalScore} 점`;
      document.getElementById('game-summary').innerText = `20문제 중 총 ${correctCount}문제를 맞추셨습니다!`;

      if(currentUser) {
        try {
          const nickName = currentUser.email.split('@')[0];
          await window.dbSet(window.dbDoc(window.fbDb, "rankings", currentUser.uid), {
            username: nickName,
            score: totalScore,
            correct: correctCount,
            updatedAt: Date.now()
          });
        } catch(e) { console.error("랭킹 등록 실패:", e); }
      }
    }

    function loadRanking() {
      const q = window.dbQuery(window.dbCollection(window.fbDb, "rankings"), window.dbOrderBy("score", "desc"), window.dbLimit(10));
      window.dbOnSnapshot(q, (snapshot) => {
        const board = document.getElementById('ranking-board');
        board.innerHTML = '';
        let rank = 1;
        snapshot.forEach((doc) => {
          const data = doc.data();
          const li = document.createElement('li');
          li.className = 'ranking-item';
          li.innerHTML = `<span><strong>${rank}위</strong>. ${data.username}</span> <span>${data.score}점</span>`;
          board.appendChild(li);
          rank++;
        });
      });
    }

    function goLobby() {
      selectedSubjects = [];
      document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active'));
      showView('view-lobby');
    }
  </script>
</body>
</html>
