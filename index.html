<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 스피드 퀴즈 챌린지</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, update, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase 설정값
    const firebaseConfig = {
      apiKey: "AIzaSyBgA0Pi_wRXAW4cTbDDybkJtJtJWBcft1c",
      authDomain: "pppp-2272a.firebaseapp.com",
      databaseURL: "https://pppp-2272a-default-rtdb.firebaseio.com",
      projectId: "pppp-2272a",
      storageBucket: "pppp-2272a.firebasestorage.app",
      messagingSenderId: "907802161105",
      appId: "1:907802161105:web:64237b2412c84e74863af0",
      measurementId: "G-PFMCL1CW13"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const rtdb = getDatabase(app); 

    window.fbAuth = auth;
    window.fbRtdb = rtdb;
    window.signIn = signInWithEmailAndPassword;
    window.signUp = createUserWithEmailAndPassword;
    window.logOut = signOut;
    
    window.dbRef = ref;
    window.dbSet = set;
    window.dbUpdate = update;
    window.dbOnValue = onValue;
    window.dbQuery = query;
    window.dbOrderByChild = orderByChild;
    window.dbLimitToLast = limitToLast;
  </script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #e3f2fd, #fce4ec); font-family: Arial, sans-serif; color: #333; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { width: min(600px, 92%); background: #ffffff; border-radius: 24px; padding: 28px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16); text-align: center; position: relative; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .subtitle { color: #777; margin-bottom: 24px; font-size: 14px; }
    .info { padding: 14px; margin-bottom: 20px; border-radius: 14px; background: #e8f5e9; color: #2e7d32; font-size: 14px; line-height: 1.6; text-align: left; }
    .hidden { display: none !important; }
    
    /* 입력 및 버튼 */
    input[type="email"], input[type="password"], input[type="text"] { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    .button-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
    button { border: none; border-radius: 12px; padding: 0 18px; height: 46px; font-size: 15px; cursor: pointer; transition: 0.15s; font-weight: bold; width: 100%; }
    button:hover { transform: translateY(-2px); opacity: 0.9; }
    button:disabled { cursor: not-allowed; opacity: 0.6; transform: none; }
    .ask-btn { background: #42a5f5; color: white; }
    .clear-btn { background: #b0bec5; color: white; }
    .secondary-btn { background: #6c757d; color: white; }

    /* 과목 그리드 */
    .subject-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 20px 0; }
    .subject-btn { padding: 15px; background: #e9ecef; color: #495057; border: 2px solid transparent; border-radius: 10px; font-weight: bold; cursor: pointer; height: auto; }
    .subject-btn.active { background: #e8f4fd; color: #1a73e8; border-color: #1a73e8; }

    /* 로딩바 및 타이머바 */
    .bar-container { width: 100%; background: #eee; height: 12px; border-radius: 6px; margin: 20px 0; overflow: hidden; position: relative; }
    .bar-fill { background: #dc3545; width: 100%; height: 100%; transition: width 0.1s linear; }
    #loadingBarFill { background: #28a745; width: 0%; transition: width 0.4s ease-out; }

    /* 퀴즈 UI */
    .quiz-text { font-size: 20px; font-weight: bold; margin-bottom: 20px; word-break: keep-all; min-height: 60px; }
    .option-btn { text-align: left; background: #f8f9fa; color: #333; border: 1px solid #ddd; margin-bottom: 8px; transition: all 0.2s ease; font-weight: normal; }
    .option-btn:hover { background: #e2e6ea; }
    .option-btn.correct-flash { background: #28a745 !important; color: white !important; border-color: #1e7e34 !important; font-weight: bold; }
    .option-btn.wrong-flash { background: #dc3545 !important; color: white !important; border-color: #bd2130 !important; }
    
    /* 팝업 효과 */
    .score-popup { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 28px; font-weight: bold; animation: fadeUp 0.8s ease-out forwards; z-index: 10; pointer-events: none; }
    .score-popup.plus { color: #28a745; }
    .score-popup.minus { color: #dc3545; }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translate(-50%, -20%) scale(0.8); }
      30% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
    }

    /* 랭킹 스타일 디자인 개선 */
    .ranking-list { text-align: left; margin: 20px 0; padding: 0; list-style: none; }
    .ranking-item { display: flex; flex-direction: column; padding: 12px; border-bottom: 1px solid #eee; gap: 4px; }
    .ranking-main { display: flex; justify-content: space-between; font-size: 16px; }
    .ranking-sub { font-size: 12px; color: #888; text-align: left; }
    .status { min-height: 24px; color: #555; font-size: 14px; margin: 10px 0; }
    .help { margin-top: 12px; font-size: 13px; color: #777; text-align: left; line-height: 1.6; }

    /* 설정창(모달) 스타일 */
    .settings-btn { position: absolute; top: 20px; right: 20px; font-size: 24px; cursor: pointer; background: transparent; border: none; width: auto; height: auto; padding: 0; }
    .settings-btn:hover { transform: rotate(45deg); }
    .setting-row { margin: 16px 0; text-align: left; }
    .setting-row label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; }
    .setting-row input[type="range"] { width: 100%; }
  </style>
</head>
<body>
  <div class="container">
    <button id="main-settings-btn" class="settings-btn hidden" onclick="openSettings()">⚙️</button>

    <h1>AI 스피드 퀴즈 챌린지</h1>
    <div class="subtitle">GitHub Pages + Google Apps Script + Realtime DB 연동</div>

    <div id="view-auth">
      <input type="email" id="auth-email" placeholder="이메일 주소">
      <input type="password" id="auth-pw" placeholder="비밀번호 (6자리 이상)">
      <div class="button-row">
        <button class="ask-btn" onclick="handleLogin()">로그인</button>
        <button class="clear-btn" onclick="handleSignUp()">신규 회원가입</button>
      </div>
    </div>

    <div id="view-lobby" class="hidden">
      <p>문제를 풀 과목을 선택하세요 (다중 선택 가능)</p>
      <div class="subject-grid">
        <button class="subject-btn" onclick="toggleSubject(this, '국어')">국어</button>
        <button class="subject-btn" onclick="toggleSubject(this, '수학')">수학</button>
        <button class="subject-btn" onclick="toggleSubject(this, '과학')">과학</button>
        <button class="subject-btn" onclick="toggleSubject(this, '사회')">사회</button>
        <button class="subject-btn" onclick="toggleSubject(this, '영어')">영어</button>
      </div>
      <div class="button-row">
        <button class="clear-btn" onclick="goLobby()">선택 초기화</button>
        <button class="ask-btn" id="askBtn" onclick="prepareGame()">퀴즈 생성 및 게임 시작</button>
      </div>
      <button onclick="handleLogout()" class="secondary-btn" style="margin-top: 15px;">로그아웃</button>
    </div>

    <div id="view-settings" class="hidden">
      <h2>⚙️ 사용자 설정</h2>
      <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ddd;">
      
      <div class="setting-row">
        <label>👤 사용자 닉네임 설정</label>
        <input type="text" id="setting-nickname" placeholder="랭킹에 표시될 닉네임">
      </div>

      <div class="setting-row">
        <label id="label-tts-rate">🔊 TTS 말하기 속도: 1.1x</label>
        <input type="range" id="setting-tts-rate" min="0.5" max="2.0" step="0.1" value="1.1" oninput="updateSettingLabels()">
      </div>

      <div class="setting-row">
        <label id="label-tts-pitch">🎵 TTS 음높이(피치): 1.0</label>
        <input type="range" id="setting-tts-pitch" min="0.5" max="1.5" step="0.1" value="1.0" oninput="updateSettingLabels()">
      </div>

      <div class="button-row" style="margin-top: 25px;">
        <button class="clear-btn" onclick="closeSettings(false)">취소</button>
        <button class="ask-btn" onclick="closeSettings(true)">설정 저장 및 적용</button>
      </div>
    </div>

    <div id="view-loading" class="hidden">
      <div id="status" class="status">Apps Script 서버에 요청을 보내는 중입니다...</div>
      <div class="bar-container">
        <div id="loadingBarFill" class="bar-fill"></div>
      </div>
    </div>

    <div id="view-game" class="hidden">
      <div id="feedback-container"></div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold;">
        <span id="quiz-progress">1 / 20</span>
        <span id="quiz-score">점수: 0점</span>
      </div>
      <div class="bar-container"><div id="timerBar" class="bar-fill"></div></div>
      <div style="font-size: 14px; color: #888; text-align: left; margin-bottom: 5px;" id="quiz-subject">[과목]</div>
      <div class="quiz-text" id="quiz-question">문제가 여기에 표시됩니다.</div>
      <div id="quiz-options"></div>
      <button onclick="speakText(document.getElementById('quiz-question').innerText)" class="secondary-btn" style="font-size: 14px; padding: 6px; margin-top: 15px; width: auto;">🔊 문제 다시 듣기</button>
    </div>

    <div id="view-result" class="hidden">
      <h2>🎉 게임 종료!</h2>
      <h1 id="final-score" style="color: #42a5f5; margin: 10px 0;">0점</h1>
      <p id="game-summary">20문제 중 X문제를 맞추셨습니다!</p>
      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">
      <h3>🏆 실시간 통합 랭킹 TOP 10</h3>
      <ul id="ranking-board" class="ranking-list"></ul>
      
      <div class="button-row">
        <button onclick="replayGame()" class="ask-btn">🔄 같은 과목으로 다시 풀기</button>
        <button onclick="goLobby()" class="clear-btn">🏠 로비(과목 선택)로 가기</button>
      </div>
    </div>

    <div class="help">
      단축키: 대기실 화면에서 Ctrl + Enter를 누르면 선택한 과목으로 게임이 바로 전송 및 시작됩니다.
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkJ4xGW7j1RxKWQ-8bbmGSDFQ1ia8u4DZZeFraAnaQ9lGFnrVHqb_rWVskf9eVKrN3/exec';

    let currentUser = null;
    let userNickname = "";
    let selectedSubjects = [];
    let gameQuizzes = [];
    let currentQuizIdx = 0;
    let totalScore = 0;
    let correctCount = 0;
    
    let timerInterval = null;
    let quizStartTime = 0;
    const LIMIT_TIME = 60; 

    // TTS 설정 기본값 전역 변수화
    let ttsRate = 1.1;
    let ttsPitch = 1.0;

    const askBtn = document.getElementById('askBtn');
    const statusBox = document.getElementById('status');
    const settingsIcon = document.getElementById('main-settings-btn');

    window.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' && event.ctrlKey) {
        const lobbyVisible = !document.getElementById('view-lobby').classList.contains('hidden');
        if (lobbyVisible) { prepareGame(); }
      }
    });

    function showView(viewId) {
      ['view-auth', 'view-lobby', 'view-settings', 'view-loading', 'view-game', 'view-result'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(viewId).classList.remove('hidden');

      // 톱니바퀴 버튼은 대기실(view-lobby)이나 설정창 상태에서만 보이게 제한
      if(viewId === 'view-lobby' || viewId === 'view-settings') {
        settingsIcon.classList.remove('hidden');
      } else {
        settingsIcon.classList.add('hidden');
      }
    }

    function setLoading(isLoading) {
      if(askBtn) {
        askBtn.disabled = isLoading;
        askBtn.textContent = isLoading ? '생성 중...' : '퀴즈 생성 및 게임 시작';
      }
    }

    function speakText(text) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = ttsRate;   // 설정 슬라이더 값 적용
      u.pitch = ttsPitch; // 설정 슬라이더 값 적용
      window.speechSynthesis.speak(u);
    }

    /* 설정 모달 컨트롤러 */
    function openSettings() {
      document.getElementById('setting-nickname').value = userNickname;
      document.getElementById('setting-tts-rate').value = ttsRate;
      document.getElementById('setting-tts-pitch').value = ttsPitch;
      updateSettingLabels();
      showView('view-settings');
    }

    function updateSettingLabels() {
      const r = document.getElementById('setting-tts-rate').value;
      const p = document.getElementById('setting-tts-pitch').value;
      document.getElementById('label-tts-rate').innerText = `🔊 TTS 말하기 속도: ${r}x`;
      document.getElementById('label-tts-pitch').innerText = `🎵 TTS 음높이(피치): ${p}`;
    }

    async function closeSettings(isSave) {
      if(isSave && currentUser) {
        const newNick = document.getElementById('setting-nickname').value.trim();
        const newRate = parseFloat(document.getElementById('setting-tts-rate').value);
        const newPitch = parseFloat(document.getElementById('setting-tts-pitch').value);

        if(!newNick) { alert("닉네임을 공백으로 설정할 수 없습니다."); return; }
        
        userNickname = newNick;
        ttsRate = newRate;
        ttsPitch = newPitch;

        try {
          // 데이터베이스 유저 메타 정보 업데이트
          await window.dbUpdate(window.dbRef(window.fbRtdb, "users/" + currentUser.uid), {
            nickname: userNickname,
            ttsRate: ttsRate,
            ttsPitch: ttsPitch
          });
          // 랭킹 목록에도 닉네임 동기화 갱신 트리거
          await window.dbUpdate(window.dbRef(window.fbRtdb, "rankings/" + currentUser.uid), {
            username: userNickname
          });
        } catch(e) { console.error("설정 저장 실패:", e); }
      }
      showView('view-lobby');
    }

    async function prepareGame() {
      if(selectedSubjects.length === 0) {
        alert('질문(과목)을 최소 1개 이상 선택해주세요.');
        return;
      }

      try {
        setLoading(true);
        showView('view-loading');
        
        const barFill = document.getElementById('loadingBarFill');
        barFill.style.width = '30%';
        statusBox.textContent = 'Apps Script 서버에 요청을 보내는 중입니다.';

        const prompt = `사용자가 고른 과목은 [${selectedSubjects.join(', ')}] 입니다. 이 과목들을 조합하여 고등학교 수준의 객관식 4지선다형 문제를 총 20개 출제해주세요. 결과는 반드시 부연 설명이나 마크다운 표기 없이 순수한 JSON 배열 포맷만 반환해야 합니다. 내부 객체 구조는 {"subject": "과목명", "q": "문제 내용", "o": ["보기1","보기2","보기3","보기4"], "a": 정답인덱스숫자0~3} 구조를 정확히 지켜주세요.`;

        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ question: prompt })
        });

        barFill.style.width = '60%';
        statusBox.textContent = '답변을 생성하는 중입니다...';

        const data = await response.json();
        if (data.error) throw new Error(data.error);

        let quizData = data.answer;
        if (typeof quizData === 'string') {
          if (quizData.startsWith("```")) {
            quizData = quizData.replace(/```json|```/g, "").trim();
          }
          gameQuizzes = JSON.parse(quizData);
        } else {
          gameQuizzes = quizData || data;
        }

        barFill.style.width = '90%';
        statusBox.textContent = '문항 배치 및 문제 셔플 완료';
        gameQuizzes.sort(() => Math.random() - 0.5);

        setTimeout(() => {
          barFill.style.width = '100%';
          statusBox.textContent = '답변 생성 완료';
          currentQuizIdx = 0; totalScore = 0; correctCount = 0;
          showView('view-game');
          renderQuiz();
          setLoading(false);
        }, 600);

      } catch (error) {
        console.error(error);
        alert('오류가 발생했습니다.\n\n' + error.message);
        statusBox.textContent = '요청 실패';
        setLoading(false);
        goLobby();
      }
    }

    function renderQuiz() {
      if(currentQuizIdx >= gameQuizzes.length || currentQuizIdx >= 20) {
        endGame(); return;
      }

      document.getElementById('feedback-container').innerHTML = '';
      const quiz = gameQuizzes[currentQuizIdx];
      
      document.getElementById('quiz-progress').innerText = `${currentQuizIdx + 1} / ${Math.min(20, gameQuizzes.length)}`;
      document.getElementById('quiz-score').innerText = `점수: ${totalScore}점`;
      document.getElementById('quiz-subject').innerText = `[${quiz.subject || '퀴즈'}]`;
      document.getElementById('quiz-question').innerText = quiz.q;

      const optionsDiv = document.getElementById('quiz-options');
      optionsDiv.innerHTML = '';
      quiz.o.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.id = `opt-btn-${idx}`;
        btn.innerText = `${idx + 1}. ${opt}`;
        btn.onclick = () => handleAnswer(idx);
        optionsDiv.appendChild(btn);
      });

      speakText(`${quiz.subject || ''} 문제입니다. ${quiz.q}`);
      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      quizStartTime = Date.now();
      const bar = document.getElementById('timerBar');
      
      timerInterval = setInterval(() => {
        const elapsed = (Date.now() - quizStartTime) / 1000;
        const remainPercent = Math.max(0, ((LIMIT_TIME - elapsed) / LIMIT_TIME) * 100);
        bar.style.width = remainPercent + '%';

        if(elapsed >= LIMIT_TIME) {
          clearInterval(timerInterval);
          handleAnswer(-1);
        }
      }, 100);
    }

    function handleAnswer(chosenIdx) {
      clearInterval(timerInterval);
      window.speechSynthesis.cancel();

      const quiz = gameQuizzes[currentQuizIdx];
      const elapsed = (Date.now() - quizStartTime) / 1000;
      
      const allButtons = document.querySelectorAll('.option-btn');
      allButtons.forEach(btn => btn.disabled = true);

      const feedbackContainer = document.getElementById('feedback-container');
      let earnedScore = 0;

      if(String(chosenIdx) === String(quiz.a)) {
        const bonus = Math.max(0, Math.round((LIMIT_TIME - elapsed) * 5));
        earnedScore = 100 + bonus;
        totalScore += earnedScore;
        correctCount++;

        document.getElementById(`opt-btn-${chosenIdx}`).classList.add('correct-flash');
        feedbackContainer.innerHTML = `<div class="score-popup plus">+${earnedScore}점!</div>`;
      } 
      else {
        if(chosenIdx !== -1) document.getElementById(`opt-btn-${chosenIdx}`).classList.add('wrong-flash');
        if(document.getElementById(`opt-btn-${quiz.a}`)) document.getElementById(`opt-btn-${quiz.a}`).classList.add('correct-flash');
        feedbackContainer.innerHTML = `<div class="score-popup minus">틀렸습니다! 0점</div>`;
      }

      document.getElementById('quiz-score').innerText = `점수: ${totalScore}점`;
      currentQuizIdx++;
      setTimeout(renderQuiz, 800);
    }

    /* 파이어베이스 로딩 확인 타이머 */
    const authCheckInterval = setInterval(() => {
      if (window.fbAuth && typeof window.fbAuth.onAuthStateChanged === 'function') {
        clearInterval(authCheckInterval);
        
        window.fbAuth.onAuthStateChanged(user => {
          if (user) {
            currentUser = user;
            // 최초 로그인 시 유저 데이터 닉네임 유무 조회 및 바인딩
            const userRef = window.dbRef(window.fbRtdb, "users/" + user.uid);
            window.dbOnValue(userRef, (snapshot) => {
              if(snapshot.exists()) {
                const uData = snapshot.val();
                userNickname = uData.nickname || user.email.split('@')[0];
                ttsRate = uData.ttsRate || 1.1;
                ttsPitch = uData.ttsPitch || 1.0;
              } else {
                userNickname = user.email.split('@')[0];
              }
              showView('view-lobby');
              try { loadRanking(); } catch(e) { console.error(e); }
            }, { onlyOnce: true });

          } else {
            currentUser = null;
            showView('view-auth');
          }
        });
      }
    }, 100);

    async function handleLogin() {
      const email = document.getElementById('auth-email').value.trim();
      const pw = document.getElementById('auth-pw').value;
      if(!email || !pw) return alert('이메일과 비밀번호를 채워주세요.');
      try { await window.signIn(window.fbAuth, email, pw); } catch(e) { alert('로그인 실패: ' + e.message); }
    }

    async function handleSignUp() {
      const email = document.getElementById('auth-email').value.trim();
      const pw = document.getElementById('auth-pw').value;
      if(!email || !pw) return alert('이메일과 비밀번호를 채워주세요.');
      try {
        await window.signUp(window.fbAuth, email, pw);
        alert('회원가입 성공!');
      } catch(e) { alert('회원가입 실패: ' + e.message); }
    }

    function handleLogout() { window.logOut(window.fbAuth); }

    function toggleSubject(btn, subjectName) {
      btn.classList.toggle('active');
      if(btn.classList.contains('active')) { selectedSubjects.push(subjectName); } 
      else { selectedSubjects = selectedSubjects.filter(s => s !== subjectName); }
    }

    // 💡 [수정] 과목배열, 가공 닉네임 반영하여 Realtime DB 저장 단추 세팅
    async function endGame() {
      showView('view-result');
      document.getElementById('final-score').innerText = `${totalScore} 점`;
      document.getElementById('game-summary').innerText = `20문제 중 총 ${correctCount}문제를 맞추셨습니다!`;

      if(currentUser) {
        try {
          await window.dbSet(window.dbRef(window.fbRtdb, "rankings/" + currentUser.uid), {
            username: userNickname,
            score: totalScore,
            negScore: -totalScore, 
            correct: correctCount,
            subjects: selectedSubjects.join(', '), // 선택했던 과목 데이터베이스 저장
            updatedAt: Date.now()
          });
        } catch(e) { console.error("Realtime DB 점수 등록 실패:", e); }
      }
    }

    // 💡 [추가] 같은 과목 조건 그대로 퀴즈만 패키징 재생성하는 버튼 바인딩 함수
    function replayGame() {
      if(selectedSubjects.length === 0) {
        alert("이전에 선택한 과목 정보가 없습니다. 로비로 이동합니다.");
        goLobby();
        return;
      }
      prepareGame();
    }

    // 💡 랭킹 보드에 닉네임과 함께 어떤 과목을 풀어서 맞췄는지 디테일하게 렌더링
    function loadRanking() {
      const rankRef = window.dbRef(window.fbRtdb, "rankings");
      const q = window.dbQuery(rankRef, window.dbOrderByChild("negScore"), window.dbLimitToLast(10));
      
      window.dbOnValue(q, (snapshot) => {
        const board = document.getElementById('ranking-board');
        if(!board) return;
        board.innerHTML = '';
        
        if(!snapshot.exists()) return;

        let rankList = [];
        snapshot.forEach((childSnapshot) => {
          rankList.push(childSnapshot.val());
        });
        
        rankList.sort((a, b) => b.score - a.score);

        rankList.forEach((data, index) => {
          const li = document.createElement('li');
          li.className = 'ranking-item';
          
          const subjectTag = data.subjects ? ` [${data.subjects}]` : "";
          
          li.innerHTML = `
            <div class="ranking-main">
              <span><strong>${index + 1}위</strong>. ${data.username}</span>
              <span><strong>${data.score}점</strong></span>
            </div>
            <div class="ranking-sub">
              정답 수: ${data.correct || 0}개 / 도전과목:${subjectTag}
            </div>
          `;
          board.appendChild(li);
        });
      }, (error) => {
        console.error("랭킹 호출 에러:", error);
      });
    }

    function goLobby() {
      selectedSubjects = [];
      document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active'));
      showView('view-lobby');
    }
  </script>
</body>
</html>
